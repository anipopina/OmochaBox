  <linearGradient id="head" x1=".18" x2=".8" y2="1" color-interpolation="linearRGB">
   <stop stop-color="#65788f" offset="0"/>
   <stop stop-color="#5b6f89" offset=".35"/>
   <stop stop-color="#5d718a" offset=".72"/>
   <stop stop-color="#8799b1" offset="1"/>
  </linearGradient>
  <linearGradient id="body" x2=".9" y1=".85" y2=".1" color-interpolation="linearRGB">
   <stop stop-color="#a5b4cc" offset="0"/>
   <stop stop-color="#9eaec6" offset=".35"/>
   <stop stop-color="#a2b2cb" offset=".7"/>
   <stop stop-color="#afbed4" offset="1"/>
  </linearGradient>
  <radialGradient id="face" cx=".45" cy=".35" r=".85" color-interpolation="linearRGB">
   <stop stop-color="#fffdf5" offset="0"/>
   <stop stop-color="#fcf9f0" offset=".4"/>
   <stop stop-color="#f9f6ed" offset=".75"/>
   <stop stop-color="#f4f0e6" offset="1"/>
  </radialGradient>
  <linearGradient id="orange" y2="1" color-interpolation="linearRGB">
   <stop stop-color="#ffbb27" offset="0"/>
   <stop stop-color="#ffb41e" offset=".35"/>
   <stop stop-color="#ffad15" offset=".7"/>
   <stop stop-color="#ffa90f" offset="1"/>
  </linearGradient>
  <linearGradient id="eyes" x2=".7" y2="1" color-interpolation="linearRGB">
   <stop stop-color="#354254" offset="0"/>
   <stop stop-color="#29374a" offset=".35"/>
   <stop stop-color="#233145" offset=".7"/>
   <stop stop-color="#2c3a4e" offset="1"/>
  </linearGradient>
 </defs>
