<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#b2e6e8" />
    <title>だれのおうち？｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta property="og:title" content="だれのおうち？｜おもちゃボックス" />
    <meta property="og:description" content="こんこん。だれかな？ ばあ！" />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/dare-no-ouchi/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="scene" aria-label="だれのおうち？">
      <div class="sun" aria-hidden="true"></div>
      <div class="ground" aria-hidden="true"></div>
      <div id="house">
        <img id="house-art" alt="" />
        <button
          id="door"
          aria-label="とびらを こんこん"
          aria-expanded="false"
          disabled
        >
          <div class="room">
            <div id="friend"><img id="portrait" alt="" /></div>
          </div>
          <span class="panels" aria-hidden="true"
            ><span class="leaf left"></span><span class="leaf right"></span
          ></span>
        </button>
      </div>
      <button id="retry" aria-label="えを もういちど よみこむ" hidden>↻</button>
      <a id="back" data-home-button href="../"></a>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
