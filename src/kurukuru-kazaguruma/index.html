<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#e9f8ff" />
    <title>くるくる、かざぐるま｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta
      property="og:title"
      content="くるくる、かざぐるま｜おもちゃボックス"
    />
    <meta
      property="og:description"
      content="さわって、はらって、くるくる。いろんな かぜを おくろう！"
    />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/kurukuru-kazaguruma/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <a
      id="back"
      data-home-button
      href="../"
      aria-label="おもちゃボックスにもどる"
    ></a>
    <main>
      <div class="toy">
        <div class="stick" aria-hidden="true"></div>
        <button
          id="wheel"
          aria-label="かざぐるま。さわるか、はらうと まわる。左右の矢印キーで向きをかえられます。"
          aria-describedby="hint"
        >
          <img
            id="rotor"
            src="./assets/rotor.svg"
            alt=""
            width="640"
            height="640"
            draggable="false"
          />
        </button>
        <svg class="breeze" viewBox="0 0 180 70" aria-hidden="true">
          <path d="M10 48Q75 60 135 22M37 66Q94 65 159 28" />
          <path class="arrow" d="m116 16 25 2-8 24" />
        </svg>
      </div>
      <p id="hint">さわって、はらって <span>くるくる！</span></p>
      <p id="status" class="sr-only" role="status"></p>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
