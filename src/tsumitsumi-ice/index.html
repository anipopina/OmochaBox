<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#73d7df" />
    <title>つみつみアイス｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta property="og:title" content="つみつみアイス｜おもちゃボックス" />
    <meta property="og:description" content="すきな アイスを つんでみよう。" />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/tsumitsumi-ice/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="scene" aria-label="つみつみアイス">
      <div id="stage">
        <button id="stack" aria-label="アイスを はずませる">
          <span id="art" aria-hidden="true"
            ><img id="cone" alt="" draggable="false" /><span id="scoops"></span
          ></span>
        </button>
      </div>
      <div id="flavors" aria-label="アイスを えらぶ">
        <button data-flavor="strawberry" aria-label="いちごを のせる">
          <img alt="" draggable="false" />
        </button>
        <button data-flavor="vanilla" aria-label="バニラを のせる">
          <img alt="" draggable="false" />
        </button>
        <button data-flavor="chocolate" aria-label="チョコを のせる">
          <img alt="" draggable="false" />
        </button>
      </div>
      <button id="reset" aria-label="からの コーンに もどす">
        <img alt="" draggable="false" /><span aria-hidden="true">↻</span>
      </button>
      <button id="retry" aria-label="えを もういちど よみこむ" hidden>↻</button>
      <span id="status" class="sr-only" aria-live="polite"></span>
      <a id="back" data-home-button href="../"></a>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
