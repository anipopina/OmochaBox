<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff3c8" />
    <title>くるっとえほん｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta property="og:title" content="くるっとえほん｜おもちゃボックス" />
    <meta
      property="og:description"
      content="めくって、もどして。つぎは だれかな？"
    />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/kurutto-ehon/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="scene" aria-label="くるっとえほん">
      <div
        id="book"
        tabindex="0"
        aria-label="えほん。みぎやじるしで つぎ、ひだりやじるしで まえ"
        data-page="0"
        data-ready="false"
        data-busy="false"
      >
        <div id="pages">
          <img id="underneath" alt="" draggable="false" />
          <div id="sheet">
            <img id="front" alt="" draggable="false" />
          </div>
          <div id="paper"></div>
          <div id="spine"></div>
        </div>
        <button id="previous" class="turn" aria-label="まえの ページ" disabled>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M29 10 15 24l14 14" />
          </svg>
        </button>
        <button id="next" class="turn" aria-label="つぎの ページ" disabled>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="m19 10 14 14-14 14" />
          </svg>
        </button>
        <div id="dots" aria-hidden="true">
          <span class="dot selected"></span><span class="dot"></span
          ><span class="dot"></span>
        </div>
        <button id="retry" aria-label="えを もういちど よみこむ" hidden>
          ↻
        </button>
        <span id="status" class="sr-only" aria-live="polite"></span>
      </div>
      <a id="back" data-home-button href="../"></a>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
