<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffdf9f" />
    <title>もぐもぐともだち｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta property="og:title" content="もぐもぐともだち｜おもちゃボックス" />
    <meta
      property="og:description"
      content="たべものを どうぞ。もぐもぐ、にっこり！"
    />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/mogumogu-tomodachi/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="play" aria-label="もぐもぐともだち">
      <svg
        class="plants"
        viewBox="0 0 1000 600"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <g fill="#a0b87e" opacity=".5">
          <path
            d="M70 480Q50 370 40 330Q14 280 8 320Q0 355 51 391Q4 355 2 398Q8 424 59 425L65 480ZM66 435Q55 352 88 329Q121 318 106 356Q97 383 66 399Z"
          />
          <path
            d="M919 480Q942 376 956 343Q982 299 991 336Q995 367 943 397Q994 367 999 409Q981 436 934 431L926 480ZM938 411Q951 350 916 329Q883 321 900 363Q912 390 938 411Z"
          />
        </g>
      </svg>
      <a
        id="back"
        data-home-button
        href="../"
        aria-label="おもちゃボックスにもどる"
      ></a>
      <button
        type="button"
        id="friend"
        data-phase="idle"
        data-art-state="loading"
        aria-label="おともだちを よんでいるよ"
        aria-disabled="true"
      >
        <svg class="friend-wait" viewBox="0 0 160 160" aria-hidden="true">
          <circle cx="80" cy="80" r="72" fill="#fff5d4" />
          <g class="hourglass">
            <path
              d="M49 31h62v14c0 19-12 27-25 35 13 8 25 16 25 35v14H49v-14c0-19 12-27 25-35-13-8-25-16-25-35Z"
              fill="#fffdf2"
              stroke="#713813"
              stroke-width="5"
            />
            <path
              class="sand-top"
              d="M56 53h48c-4 9-13 16-24 23-11-7-20-14-24-23Z"
              fill="#ed8d18"
            />
            <path
              class="sand-fall"
              d="M80 79v34"
              stroke="#ed8d18"
              stroke-width="4"
              stroke-linecap="round"
              stroke-dasharray="3 8"
            />
            <path
              class="sand-bottom"
              d="M55 122c4-8 14-16 25-21 11 5 21 13 25 21Z"
              fill="#ed8d18"
            />
            <path
              d="M43 32h74M43 128h74"
              stroke="#713813"
              stroke-width="15"
              stroke-linecap="round"
            />
            <path
              d="M43 30h74M43 126h74"
              stroke="#ffbd4c"
              stroke-width="8"
              stroke-linecap="round"
            />
          </g>
        </svg>
        <svg class="friend-retry" viewBox="0 0 160 160" aria-hidden="true">
          <g class="retry-target">
            <circle
              cx="72"
              cy="70"
              r="56"
              fill="#00786c"
              stroke="#124c48"
              stroke-width="5"
            />
            <circle cx="72" cy="66" r="46" fill="#38e1aa" />
            <path
              d="M92 49a25 25 0 1 0 4 30m-3-43 1 16-16-1"
              fill="none"
              stroke="#124c48"
              stroke-width="8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
          <circle
            class="retry-ripple"
            cx="104"
            cy="91"
            r="14"
            fill="none"
            stroke="#124c48"
            stroke-width="4"
          />
          <g class="retry-hand" transform="translate(80 78) scale(.62)">
            <path
              d="M35 104L18 73Q11 59 21 57Q28 54 39 69L29 26Q26 12 36 12Q43 12 46 24L53 50Q56 40 64 46Q70 38 78 48Q87 42 92 58L96 79Q98 94 80 110Z"
              fill="#fffdf2"
              stroke="#124c48"
              stroke-width="6"
              stroke-linejoin="round"
            />
          </g>
        </svg>
        <span class="friend-art">
          <img class="body-art" alt="" draggable="false" />
          <svg class="face" viewBox="0 0 500 500" aria-hidden="true">
            <defs>
              <clipPath id="mouth-clip">
                <ellipse cx="250" cy="290" rx="83" ry="62" />
              </clipPath>
            </defs>
            <g class="eyes-open">
              <ellipse cx="193" cy="205" rx="23" ry="28" fill="#fff9e4" />
              <ellipse cx="307" cy="205" rx="23" ry="28" fill="#fff9e4" />
              <ellipse cx="197" cy="208" rx="12" ry="17" fill="#34312e" />
              <ellipse cx="303" cy="208" rx="12" ry="17" fill="#34312e" />
              <circle cx="200" cy="202" r="4" fill="white" />
              <circle cx="306" cy="202" r="4" fill="white" />
            </g>
            <g
              class="eyes-happy"
              fill="none"
              stroke="#34312e"
              stroke-width="10"
              stroke-linecap="round"
            >
              <path d="M174 212Q193 180 212 212M288 212Q307 180 326 212" />
            </g>
            <ellipse
              class="cheek cheek-left"
              cx="148"
              cy="270"
              rx="24"
              ry="18"
              fill="#ff9b9c"
            />
            <ellipse
              class="cheek cheek-right"
              cx="352"
              cy="270"
              rx="24"
              ry="18"
              fill="#ff9b9c"
            />
            <path
              class="bear-nose"
              d="M238 214Q250 209 262 214Q265 218 250 226Q235 218 238 214"
              fill="#57382b"
            />
            <g class="mouth-open">
              <ellipse cx="250" cy="290" rx="83" ry="62" fill="#713b36" />
              <g clip-path="url(#mouth-clip)">
                <ellipse cx="253" cy="342" rx="64" ry="33" fill="#ed8078" />
                <image id="mouth-food" x="206" y="220" width="88" height="88" />
              </g>
            </g>
            <path
              class="mouth-closed"
              d="M218 281Q234 292 250 281Q266 292 282 281"
              fill="none"
              stroke="#633e34"
              stroke-width="8"
              stroke-linecap="round"
            />
            <path
              class="mouth-smile"
              d="M220 273Q250 311 280 273"
              fill="none"
              stroke="#633e34"
              stroke-width="9"
              stroke-linecap="round"
            />
          </svg>
          <span class="delight" aria-hidden="true"
            ><i>♥</i><i>✦</i><i>♥</i></span
          >
        </span>
      </button>
      <div class="table" aria-hidden="true"></div>
      <img id="flying-food" alt="" draggable="false" hidden />
      <div id="foods" role="group" aria-label="たべものを どうぞ">
        <button data-food="strawberry" aria-label="いちごを あげる">
          <img alt="" draggable="false" />
        </button>
        <button data-food="banana" aria-label="バナナを あげる">
          <img alt="" draggable="false" />
        </button>
        <button data-food="carrot" aria-label="にんじんを あげる">
          <img alt="" draggable="false" />
        </button>
      </div>
      <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    </main>
    <script type="module" src="entry.ts"></script>
  </body>
</html>
