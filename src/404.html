<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ページがみつかりません｜おもちゃボックス</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 24px;
        text-align: center;
        background: #fff333;
        color: #10194c;
        font-family: sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: clamp(24px, 5vw, 36px);
      }
      a {
        display: grid;
        place-items: center;
        min-height: 64px;
        padding: 12px 20px;
        border: 3px solid #10194c;
        border-radius: 24px;
        background: #fff;
        color: inherit;
        font-size: 22px;
        font-weight: bold;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 4px solid #8c2ac5;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <h1>ページがみつからないよ</h1>
    <a href="/">おもちゃボックスにもどる</a>
  </body>
</html>
