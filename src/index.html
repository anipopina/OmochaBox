<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff333" />
    <meta
      name="description"
      content="さわって、なぞって、みつけよう。小さな遊びのおもちゃボックス。"
    />
    <title>おもちゃボックス</title>
    <link rel="stylesheet" href="box.css" />
    <script type="module" src="box.ts"></script>

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta property="og:title" content="おもちゃボックス" />
    <meta
      property="og:description"
      content="さわって、なぞって、みつけよう。小さな遊びのおもちゃボックス。"
    />
    <meta
      property="og:url"
      content="https://omochabox-initial-20261020.ryonchibi.chatgpt.site/"
    />
    <meta
      property="og:image"
      content="https://omochabox-initial-20261020.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header>
      <span class="small-label">ちいさな あそびば</span>
      <a class="brand" href="./" aria-label="おもちゃボックス ホーム">
        <span class="brand-title">おもちゃボックス</span>
      </a>
      <div class="characters" aria-hidden="true">
        <img
          class="character character-square"
          src="./assets/characters/01-coral-square.svg?no-inline"
          width="512"
          height="461"
          alt=""
          fetchpriority="high"
        />
        <img
          class="character character-purple"
          src="./assets/characters/03-purple-circle.svg?no-inline"
          width="509"
          height="512"
          alt=""
        />
        <img
          class="character character-star"
          src="./assets/characters/05-coral-star.svg?no-inline"
          width="512"
          height="487"
          alt=""
        />
        <img
          class="character character-cyan"
          src="./assets/characters/02-cyan-circle.svg?no-inline"
          width="512"
          height="428"
          alt=""
        />
        <img
          class="character character-triangle"
          src="./assets/characters/04-yellow-triangle.svg?no-inline"
          width="512"
          height="450"
          alt=""
        />
        <img
          class="character character-mint"
          src="./assets/characters/06-mint-rectangle.svg?no-inline"
          width="485"
          height="512"
          alt=""
        />
      </div>
    </header>
    <main>
      <div class="intro">
        <h1>すきなあそびを えらんでね！</h1>
      </div>
      <div id="games" class="games" aria-label="あそびをえらぶ"></div>
      <noscript
        ><p>
          <a href="hikari-no-oekaki/">ひかりのおえかきへ</a>（遊ぶには
          JavaScript を有効にしてください）
        </p></noscript
      >
    </main>
    <footer>
      <span aria-hidden="true">✦</span> こどものペースで、なんどでも。
      <p>
        <a class="creator-link" href="https://anipopina.com/"
          >かいはつ: anipopina</a
        >
      </p>
    </footer>
  </body>
</html>
