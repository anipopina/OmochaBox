<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#15a9c3" />
    <title>ふきふき、まど｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta property="og:title" content="ふきふき、まど｜おもちゃボックス" />
    <meta
      property="og:description"
      content="ゆびで曇った窓をふきふき。庭や海、いろんな景色のなかまをみつけよう。"
    />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/fukifuki-mado/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header>
      <a id="back" href="../" aria-label="おもちゃボックスにもどる">← もどる</a>
      <h1>
        <img
          src="../assets/characters/02-cyan-circle.svg"
          alt=""
          aria-hidden="true"
        />
        <span>ふきふき、まど</span>
        <img
          src="../assets/characters/04-yellow-triangle.svg"
          alt=""
          aria-hidden="true"
        />
      </h1>
    </header>
    <main>
      <p id="hint">ゆびで ふきふき。だれが いるかな？</p>
      <div class="window">
        <img
          id="picture"
          src="assets/garden.webp"
          alt="お花いっぱいの庭に、ねことうさぎといぬ。木の枝には小鳥。"
          draggable="false"
        /><canvas
          id="fog"
          tabindex="0"
          role="img"
          aria-label="くもったまど。指でなぞると景色が見えます。キーボードでは矢印で移動、スペースで拭けます。"
        ></canvas
        ><span id="shine" aria-hidden="true">✦</span>
      </div>
      <button id="cloud" aria-label="つぎのまど">
        <span aria-hidden="true">➜</span> つぎのまど
      </button>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
