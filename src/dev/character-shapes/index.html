<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キャラクターの当たり判定</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>キャラクターの当たり判定</h1>
      <p id="instructions">キャラクターをドラッグして、ぶつけてみよう。</p>
      <div class="controls">
        <label class="picker">
          キャラクター
          <select id="character"></select>
        </label>
        <button id="add" type="button">追加</button>
        <label class="toggle">
          <input id="outline" type="checkbox" checked />
          当たり判定を表示
        </label>
        <button id="reset" type="button">リセット</button>
      </div>
      <canvas
        id="board"
        aria-describedby="instructions"
        aria-label="キャラクターを動かすフィールド"
      ></canvas>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
