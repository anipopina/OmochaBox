<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff9eb" />
    <title>ぽんぽんスタンプ｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta property="og:title" content="ぽんぽんスタンプ｜おもちゃボックス" />
    <meta
      property="og:description"
      content="えらんで、ぽん！ なかまたちで じぶんの えを つくろう。"
    />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/ponpon-stamp/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <a
      id="back"
      data-home-button
      href="../"
      aria-label="おもちゃボックスにもどる"
    ></a>
    <main>
      <div class="paper-wrap">
        <div
          id="paper"
          tabindex="0"
          role="button"
          aria-label="スタンプのかみ。タップしておす。矢印キーで場所を選び、スペースかEnterでおす。"
          aria-describedby="status"
        >
          <div id="effects" aria-hidden="true"></div>
          <div id="stamps" aria-hidden="true"></div>
          <span id="cursor" aria-hidden="true"></span>
        </div>
        <p id="full" hidden>かみが いっぱい。あたらしい かみで あそぼう</p>
      </div>
      <aside aria-label="スタンプをえらぶ">
        <div class="palette-pager">
          <button
            id="previous-page"
            class="page-arrow"
            aria-label="まえの スタンプ"
            aria-controls="palette"
          >
            <span aria-hidden="true">◀</span>
          </button>
          <div id="palette" role="group" aria-label="スタンプ"></div>
          <button
            id="next-page"
            class="page-arrow"
            aria-label="つぎの スタンプ"
            aria-controls="palette"
          >
            <span aria-hidden="true">▶</span>
          </button>
        </div>
        <p id="page-status" class="sr-only" role="status"></p>
      </aside>
      <button id="new" disabled aria-label="あたらしいかみ">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 4h18l12 12v28H10Z M28 4v12h12" />
        </svg>
        <small>あたらしい かみ</small>
      </button>
    </main>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    <dialog id="confirm">
      <form method="dialog">
        <svg class="sheet-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 4h18l12 12v28H10Z M28 4v12h12" />
        </svg>
        <p>あたらしい かみに する？</p>
        <div>
          <button value="cancel" autofocus aria-label="いまのかみでつづける">
            <span aria-hidden="true">↩</span><small>つづける</small></button
          ><button id="clear" value="clear" aria-label="あたらしいかみにする">
            <span aria-hidden="true">✓</span><small>あたらしい かみ</small>
          </button>
        </div>
      </form>
    </dialog>
    <script type="module" src="app.ts"></script>
  </body>
</html>
