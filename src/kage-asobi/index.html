<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffc94e" />
    <title>のびのび、かげあそび｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta
      property="og:title"
      content="のびのび、かげあそび｜おもちゃボックス"
    />
    <meta
      property="og:description"
      content="ひかりを うごかすと、かげが のびのび！"
    />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/kage-asobi/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="scene" aria-label="のびのび、かげあそび">
      <img id="shadow" class="rabbit" alt="" aria-hidden="true" />
      <img id="rabbit" class="rabbit" alt="赤いうさぎのぬいぐるみ" />
      <button id="light" aria-label="ひかりをうごかす">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle
            cx="32"
            cy="32"
            r="17"
            fill="#fff1a2"
            stroke="currentColor"
            stroke-width="3"
          />
          <path
            d="M32 3v7m0 44v7M3 32h7m44 0h7M11 11l5 5m32 32 5 5M11 53l5-5m32-32 5-5"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />
          <circle cx="26" cy="30" r="2" />
          <circle cx="38" cy="30" r="2" />
          <path
            d="M26 38q6 6 12 0"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <p id="hint"><span>↔ ひかりを うごかしてね ↕</span></p>
      <button id="reset" aria-label="ひかりを もとのばしょへ">↻</button>
      <a id="back" data-home-button href="../"></a>
    </main>
    <script type="module" src="app.ts"></script>
  </body>
</html>
