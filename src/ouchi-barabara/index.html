<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#3fb4ff" />
    <title>おうちバラバラ｜おもちゃボックス</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="おもちゃボックス" />
    <meta property="og:title" content="おうちバラバラ｜おもちゃボックス" />
    <meta
      property="og:description"
      content="タップで ショベルカー。おうちが ガラガラ！"
    />
    <meta
      property="og:url"
      content="https://omochabox.ryonchibi.chatgpt.site/ouchi-barabara/"
    />
    <meta
      property="og:image"
      content="https://omochabox.ryonchibi.chatgpt.site/assets/branding/ogp.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="黄色の背景に、おもちゃボックスの文字とカラフルな図形のなかまたち。"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="scene">
      <canvas
        id="field"
        tabindex="0"
        role="button"
        aria-label="ショベルカーで おうちを こわす。エンターキーや スペースキーでも うごくよ"
      ></canvas>
      <p id="fallback" hidden>
        <span aria-hidden="true">🚜🏠</span>
        このきかいでは あそべないよ
      </p>
      <button id="next" type="button" hidden aria-label="つぎの おうちへ">
        <svg viewBox="0 0 120 100" aria-hidden="true">
          <!-- House part of the icon; change the second number of translate
               to move it up (negative) or down (positive), in icon units
               (the icon is 120 × 100). -->
          <g transform="translate(0 -8)">
            <path
              d="M10 50 L40 24 L70 50 Z"
              fill="#2f73e0"
              stroke="#17396b"
              stroke-width="5"
              stroke-linejoin="round"
            />
            <rect
              x="18"
              y="48"
              width="44"
              height="36"
              fill="#ff6f9c"
              stroke="#17396b"
              stroke-width="5"
            />
            <rect
              x="34"
              y="62"
              width="12"
              height="22"
              fill="#ffd23f"
              stroke="#17396b"
              stroke-width="4"
            />
          </g>
          <path
            d="M74 44 H90 V32 L112 54 L90 76 V64 H74 Z"
            fill="#ffc414"
            stroke="#17396b"
            stroke-width="5"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <a id="back" data-home-button href="../"></a>
    </main>
    <script type="module" src="entry.ts"></script>
  </body>
</html>
